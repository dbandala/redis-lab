name: redis-lab-cluster

networks:
  redis-cluster-net:
    name: redis-lab-cluster-net

services:
  redis-cluster-1:
    image: redis:8.10.1
    container_name: redis-cluster-1
    ports: ["6400:6379", "16400:16379"]
    volumes: [redis-cluster-1-data:/data]
    command: ["redis-server", "--port", "6379",
              "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--cluster-node-timeout", "5000",
              "--appendonly", "yes", "--save", "60", "1"]
    networks: [redis-cluster-net]

  redis-cluster-2:
    image: redis:8.10.1
    container_name: redis-cluster-2
    ports: ["6401:6379", "16401:16379"]
    volumes: [redis-cluster-2-data:/data]
    command: ["redis-server", "--port", "6379",
              "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--cluster-node-timeout", "5000",
              "--appendonly", "yes", "--save", "60", "1"]
    networks: [redis-cluster-net]

  redis-cluster-3:
    image: redis:8.10.1
    container_name: redis-cluster-3
    ports: ["6402:6379", "16402:16379"]
    volumes: [redis-cluster-3-data:/data]
    command: ["redis-server", "--port", "6379",
              "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--cluster-node-timeout", "5000",
              "--appendonly", "yes", "--save", "60", "1"]
    networks: [redis-cluster-net]

  redis-cluster-4:
    image: redis:8.10.1
    container_name: redis-cluster-4
    ports: ["6403:6379", "16403:16379"]
    volumes: [redis-cluster-4-data:/data]
    command: ["redis-server", "--port", "6379",
              "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--cluster-node-timeout", "5000",
              "--appendonly", "yes", "--save", "60", "1"]
    networks: [redis-cluster-net]

  redis-cluster-5:
    image: redis:8.10.1
    container_name: redis-cluster-5
    ports: ["6404:6379", "16404:16379"]
    volumes: [redis-cluster-5-data:/data]
    command: ["redis-server", "--port", "6379",
              "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--cluster-node-timeout", "5000",
              "--appendonly", "yes", "--save", "60", "1"]
    networks: [redis-cluster-net]

  redis-cluster-6:
    image: redis:8.10.1
    container_name: redis-cluster-6
    ports: ["6405:6379", "16405:16379"]
    volumes: [redis-cluster-6-data:/data]
    command: ["redis-server", "--port", "6379",
              "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf",
              "--cluster-node-timeout", "5000",
              "--appendonly", "yes", "--save", "60", "1"]
    networks: [redis-cluster-net]

  redisinsight:
    image: redis/redisinsight:3.8.0
    container_name: redisinsight-cluster
    ports: ["8004:5540"]
    volumes: [redisinsight-cluster-data:/data]
    networks: [redis-cluster-net]

volumes:
  redis-cluster-1-data:
  redis-cluster-2-data:
  redis-cluster-3-data:
  redis-cluster-4-data:
  redis-cluster-5-data:
  redis-cluster-6-data:
  redisinsight-cluster-data:
