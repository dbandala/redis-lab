services:
  redis:
    image: redis:8.10.1
    container_name: redis-production-and-real-world-systems
    ports:
      - "6379:6379"   # redis-cli / RESP protocol
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]

  redisinsight:
    image: redis/redisinsight:3.8.0
    container_name: redisinsight-production-and-real-world-systems
    depends_on:
      - redis
    ports:
      - "8001:5540"   # RedisInsight web UI
    volumes:
      - redisinsight-data:/data

volumes:
  redis-data:
  redisinsight-data:
